<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - AquaVerde S.A.S.</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <img src="assets/img/logo.svg" alt="AquaVerde Logo" class="logo">
            <h1 class="company-name">AquaVerde S.A.S.</h1>
        </div>
    </header>

    <nav class="secondary-nav">
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="quienes-somos.html">Quiénes Somos</a></li>
            <li><a href="https://www.unicartagena.edu.co" target="_blank">Universidad de Cartagena</a></li>
        </ul>
    </nav>

    <main>
        <div class="container">
            <h1 class="page-title">Contáctenos</h1>
            
            <form class="contact-form" action="#" method="post">
                <div class="form-group">
                    <label for="nombre">Nombre completo *</label>
                    <input type="text" id="nombre" name="nombre" required minlength="3" maxlength="100" placeholder="Ingrese su nombre completo">
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico *</label>
                    <input type="email" id="email" name="email" required maxlength="100" placeholder="ejemplo@correo.com">
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" maxlength="20" placeholder="Ingrese su número de teléfono">
                </div>

                <div class="form-group">
                    <label for="ciudad">Ciudad</label>
                    <input type="text" id="ciudad" name="ciudad" maxlength="50" placeholder="Ingrese su ciudad">
                </div>

                <div class="form-group">
                    <label for="motivo">Motivo de contacto *</label>
                    <select id="motivo" name="motivo" required>
                        <option value="">Seleccione una opción</option>
                        <option value="pedido">Pedido</option>
                        <option value="soporte">Soporte</option>
                        <option value="distribucion">Distribución</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="mensaje">Mensaje *</label>
                    <textarea id="mensaje" name="mensaje" required minlength="10" rows="5" placeholder="Escriba su mensaje aquí..."></textarea>
                </div>

                <button type="submit" class="btn-submit">Enviar mensaje</button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <p class="footer-academic">Este Portal es realizado con fines académicos</p>
        <p class="footer-copyright">&copy; 2026 AquaVerde S.A.S. | <span>Diego Andrés Martínez Flórez</span></p>
    </footer>
</body>
</html>
